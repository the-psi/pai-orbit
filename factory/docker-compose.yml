# Agentic Factory — the same file runs on Docker Desktop and on a server.
#
#   cp config/factory.example.json factory.config.json   # then edit it
#   cp .env.example .env                                 # then add credentials
#   docker compose up -d --build
#   docker compose exec factory node /opt/orbit/factory/bin/factory.js status
#
# Only the environment differs between a laptop and a server (REQ-37).
services:
  factory:
    build:
      context: ..
      dockerfile: factory/Dockerfile
    image: orbit-factory
    restart: unless-stopped
    env_file: .env
    volumes:
      - factory-data:/data
      - ./factory.config.json:/config/factory.config.json:ro
    # A clean stop lets stages in flight finish before the container exits.
    stop_grace_period: 2m

  # The status page: http://localhost:8080
  # FACTORY_UI_PASSWORD lets people look. FACTORY_UI_USERS ("name:password,...") lets a named
  # person approve, send back and answer. The page refuses to start with neither.
  ui:
    image: orbit-factory
    restart: unless-stopped
    command: ["ui"]
    environment:
      FACTORY_UI_HOST: 0.0.0.0
      FACTORY_UI_PASSWORD: ${FACTORY_UI_PASSWORD:-}
      FACTORY_UI_USERS: ${FACTORY_UI_USERS:-}
    ports:
      - "8080:8080"
    volumes:
      # Read and write: the page records a person's decision here for the factory to pick up.
      - factory-data:/data
      - ./factory.config.json:/config/factory.config.json:ro

volumes:
  factory-data:
